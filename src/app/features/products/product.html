
<div class="container-products">
    <div class="sidebar">
        <h2>FILTERS</h2>
        <div class="container-category">
            <h3>CATEGORY</h3>
            <div class="category">
                <div class="filter">
                    <input type="checkbox" id="all">
                    <label for="all">All</label>
                </div>
                <span class="stock">24</span>
            </div>
            <div class="category">
                <div class="filter">
                    <input type="checkbox" id="Shorts"/>
                    <label for="Shorts">Shorts</label>
                </div>
                <span class="stock">24</span>
            </div>
            <div class="category">
                <div class="filter">
                    <input type="checkbox" id="jackets"/>
                    <label for="jackets">Jackets</label>
                </div>
                <span class="stock">24</span>
            </div>
        </div>
        <div class="container-price">
            <h3>PRICE</h3>
            <div class="price">
                <div class="minPrice">
                    <label for="minVal">Min:</label>
                    <input type="number" id="minVal">
                </div>
                <div class="maxPrice">
                    <label for="maxVal">Max:</label>
                    <input type="number" id="maxVal">
                </div>
            </div>
        </div>
    </div>
    <div class="products">
        <div class="container-target">
            @for (product of listProduct.getProducts(); track product.id) {
            <div class="target">    
                <img [src]="[product.images]">
                <div class="target-inf">
                    <h4>{{product.name}}</h4>
                    <p>{{product.description}}</p>
                </div>
                <button class="btn-product" >Comprar</button>
            </div>
            }
        </div>
    </div>
</div>
